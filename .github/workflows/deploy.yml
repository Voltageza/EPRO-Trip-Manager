name: Deploy to Proxmox

# The container is only reachable on the tailnet, so the runner joins the
# tailnet as an ephemeral node, then redeploys over SSH.
#
# Required repository secrets:
#   TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET   Tailscale OAuth client, scope tag:ci
#   DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS    printed by the CI key setup
# Required repository variable:
#   EPRO_HOST                             MagicDNS name of the container
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: deploy-trips-production
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # Chromium comes from apt on the server; no need to download one here.
    env:
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build both frontends
        run: npm run build

      - name: Syntax-check the server
        run: |
          set -euo pipefail
          find server/src -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "server sources parse cleanly"

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # Skip until the CI secrets are configured, so the workflow stays green
    # on a repo that has not been wired up to a server yet.
    if: vars.EPRO_HOST != ''
    environment: production
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Redeploy
        env:
          EPRO_HOST: ${{ vars.EPRO_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

          # The key is pinned to a forced command on the server, so the command
          # sent here is ignored - it always runs the trip manager's update.sh.
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=20 \
            "root@${EPRO_HOST}" deploy
