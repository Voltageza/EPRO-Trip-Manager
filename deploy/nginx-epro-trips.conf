# E-Pro Trip Manager.
#
# Shares a container with the quotation system, so it takes its own loopback
# port. Tailscale serves it on https://<node>:8443 while the quotation system
# keeps 443.
server {
    listen 127.0.0.1:8081;
    server_name _;

    # job-card photo uploads; the app also accepts 25 MB JSON bodies
    client_max_body_size 30m;

    access_log /var/log/nginx/epro-trips.access.log;
    error_log  /var/log/nginx/epro-trips.error.log;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite emits content-hashed filenames, so these are safe to cache hard.
    location /assets/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # PDF rendering via headless Chromium is not fast
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
